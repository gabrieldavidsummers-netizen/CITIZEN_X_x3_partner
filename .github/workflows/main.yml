name: Partner Build 13579

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # STRIKE 1: THE HARDWARE HACK (Adding 4GB of Virtual RAM)
      - name: Add Swap Space
        run: |
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo swapon --show

      # STRIKE 2: Open the floor
      - name: Fix Workspace Permissions
        run: |
          chmod -R 777 .
          sudo chown -R 1000:1000 .

      # STRIKE 3: The Stabilized Forge
      - name: Build with Buildozer Docker
        uses: docker://kivy/buildozer:latest
        with:
          args: android debug
        env:
          ACCEPT_SDK_LICENSE: "yes"
          BUILDOZER_WARN_ON_ROOT: 0
          # We keep the RAM limits on Gradle just to be safe
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx1536m"
          BUILDOZER_LOG_LEVEL: 2

      - name: Upload Partner APK
        uses: actions/upload-artifact@v4
        with:
          name: Partner-Build-13579
          path: bin/*.apk
          if-no-files-found: error
          
