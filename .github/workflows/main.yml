name: Lightning Build 13579

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04 # Stable iron
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
          build-essential python3-dev python3-pip libsqlite3-dev sqlite3 bzip2 \
          libbz2-dev zlib1g-dev libgdbm-dev libgdbm-compat-dev liblzma-dev \
          libreadline-dev uuid-dev libopenblas-dev libxml2-dev libxslt-dev \
          openjdk-17-jdk ant

      - name: Install Buildozer
        run: |
          pip install --user --upgrade buildozer cython==0.29.33
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build with Buildozer
        run: |
          # The 'yes |' handles all license prompts automatically
          yes | buildozer -v android debug
        env:
          # Limit Gradle memory to stay under the 7GB runner limit
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CITIZEN_X_PAYLOAD
          path: bin/*.apk
          
