name: Surgical Build 13579

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Surgical Dependency Injection
        # We only install the critical missing libs to avoid the 9-minute delay
        run: |
          sudo apt update
          sudo apt install -y libncurses5 libtinfo5 pkg-config

      - name: Install Buildozer & Cython
        run: |
          pip install --user --upgrade buildozer cython==0.29.33
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Forge APK
        run: |
          # Use --profile to ensure we are using the minimal required tools
          yes | buildozer -v android debug
        env:
          # Keep Gradle on a short leash to save RAM
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CITIZEN_X_FINAL
          path: bin/*.apk
          
