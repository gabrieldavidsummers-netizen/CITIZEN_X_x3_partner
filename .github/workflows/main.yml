name: Partner Build 13579
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3-dev openjdk-17-jdk unzip zip libffi-dev libssl-dev autoconf automake libtool ccache libncurses5
          pip install --upgrade pip
          pip install "Cython==0.29.33" buildozer Pillow

      - name: Manifest Icon
        run: |
          python -c "from PIL import Image; img = Image.new('RGB', (512, 512), color = (0, 0, 0)); img.save('calc_icon.png')"

      - name: Build Partner APK (The Iteration Killer)
        run: |
          # COMPLETELY BLINDING THE RUNNER TO SYSTEM NDK
          unset ANDROID_NDK_HOME
          unset ANDROID_NDK_LATEST_HOME
          export ANDROID_NDK_ROOT=""
          
          export BUILDOZER_ALLOW_ORG_NAME_START=1
          # FORCE BUILD WITHOUT INTERACTION
          buildozer -v android debug
        env:
          ACCEPT_SDK_LICENSE: "y"
          APP_ANDROID_ACCEPT_SDK_LICENSE: "1"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PARTNER_X_APK
          path: bin/*.apk
          
