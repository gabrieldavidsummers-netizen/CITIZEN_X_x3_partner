name: Skeleton Forge 13579

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Tools
        run: |
          sudo apt update
          sudo apt install -y libncurses5 libtinfo5 pkg-config cmake
          pip install --user --upgrade buildozer cython==0.29.33

      - name: Forge
        run: |
          # Strike without looking back. 
          # No 'clean' command to trip on empty directories.
          export PATH=$PATH:$HOME/.local/bin
          buildozer -v android debug
          
