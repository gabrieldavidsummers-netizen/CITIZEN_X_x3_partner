name: Partner Build 13579

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest # Docker handles the OS, so we go back to latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # THE ATOMIC BYPASS: Using a Docker container to ignore host conflicts
      - name: Build with Buildozer Docker
        uses: docker://kivy/buildozer:latest
        with:
          args: android debug
        env:
          ACCEPT_SDK_LICENSE: "yes"

      - name: Upload Partner APK
        uses: actions/upload-artifact@v4
        with:
          name: Partner-Build-13579
          path: bin/*.apk
          if-no-files-found: error
          
