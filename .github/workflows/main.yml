name: Skeleton Forge 13579

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y libncurses5 libtinfo5 pkg-config cmake antiword
          pip install --user --upgrade buildozer cython==0.29.33

      - name: Forge
        run: |
          export PATH=$PATH:$HOME/.local/bin
          # THE STRIKE: Force a fresh start
          buildozer android clean
          buildozer -v android debug
          
