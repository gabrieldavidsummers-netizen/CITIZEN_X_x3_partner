name: Partner Build 13579

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # STRIKE: Fix the UID conflict before Docker starts
      - name: Fix Workspace Permissions
        run: |
          chmod -R 777 .
          sudo chown -R 1000:1000 .

      - name: Build with Buildozer Docker
        uses: docker://kivy/buildozer:latest
        with:
          args: android debug
        env:
          ACCEPT_SDK_LICENSE: "yes"

      - name: Upload Partner APK
        uses: actions/upload-artifact@v4
        with:
          name: Partner-Build-13579
          path: bin/*.apk
          if-no-files-found: error
          
