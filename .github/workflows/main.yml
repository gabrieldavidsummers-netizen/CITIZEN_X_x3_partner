name: Partner Build 13579
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3-dev openjdk-17-jdk unzip zip libffi-dev libssl-dev autoconf automake libtool ccache libncurses5
          pip install --upgrade pip
          pip install "cython<3.0" buildozer Pillow

      - name: Build Partner APK (Silent Strike)
        run: |
          export BUILDOZER_ALLOW_ORG_NAME_START=1
          # Using --android-api to force alignment and avoiding the 'yes' pipe
          buildozer -v android debug
        env:
          ACCEPT_SDK_LICENSE: "y"
          # This variable helps bypass the interactive prompt internally
          APP_ANDROID_ACCEPT_SDK_LICENSE: "1"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PARTNER_X_APK
          path: bin/*.apk
          
