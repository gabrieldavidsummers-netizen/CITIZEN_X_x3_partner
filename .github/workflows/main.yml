name: Iron-Grip Strike 13579

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Forge APK
        run: |
          # FORCE 'YES' TO THE ROOT PROMPT AND EXECUTE
          # Using 'yes' pipes 'y' infinitely to any prompt
          yes | buildozer -v android debug
        env:
          # Additional flag to suppress root warnings
          BUILDOZER_WARN_ON_ROOT: 0
          TERM: dumb
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CITIZEN_X_PARTNER_FINAL
          path: bin/*.apk
          
