name: Partner Build 13579

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # THE RE-ANCHOR: Moving back to the stable anvil
    runs-on: ubuntu-22.04 
    timeout-minutes: 60 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clear Legacy Cache
        run: |
          rm -rf .buildozer
          rm -rf bin/
          mkdir -p .buildozer

      - name: Install Buildozer Dependencies
        run: |
          sudo apt update
          # This list is tuned for the 22.04 Jammy environment
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
          build-essential python3-dev python3-pip libsqlite3-dev sqlite3 bzip2 \
          libbz2-dev zlib1g-dev libgdbm-dev libgdbm-compat-dev liblzma-dev \
          libreadline-dev uuid-dev libopenblas-dev libxml2-dev libxslt-dev \
          openjdk-17-jdk ant

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer "cython<3.0"

      - name: Execute Partner Build
        run: |
          buildozer -v android debug
        env:
          ACCEPT_SDK_LICENSE: "yes"

      - name: Upload Partner APK
        uses: actions/upload-artifact@v4
        with:
          name: Partner-Build-13579
          path: bin/*.apk
          if-no-files-found: error
          
