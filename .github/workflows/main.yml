name: Override Strike 13579

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build APK with Buildozer Action
        uses: Josh-Feldman/buildozer-action@master
        with:
          save_build_dir: true
          buildozer_version: master
          python_version: 3.11

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CITIZEN_X_PARTNER_STRIKE
          path: bin/*.apk
          
