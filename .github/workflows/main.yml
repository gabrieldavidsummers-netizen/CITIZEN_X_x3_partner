name: Persistence Build 13579

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # STRIKE: Cache the Android Workshop to save 10+ minutes on future runs
      - name: Cache Buildozer Global Directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Add Swap Space
        run: |
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Surgical Dependency Injection
        run: |
          sudo apt update
          sudo apt install -y libncurses5 libtinfo5 pkg-config cmake openjdk-17-jdk

      - name: Install Buildozer & Cython
        run: |
          pip install --user --upgrade buildozer cython==0.29.33
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Forge APK
        run: buildozer -v android debug
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"
          
